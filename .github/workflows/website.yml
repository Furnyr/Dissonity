name: Website

on: 
  push:
    branches:
      - main
    paths:
      - "website/**/*.ts"
      - "website/**/*.tsx"
      - "website/**/*.js"
      - "website/**/*.jsx"
      - "website/**/*.html"
      - "website/**/*.css"
      - "website/**/*.json"
      - "website/assets/*"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  site_deploy:
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    runs-on: ubuntu-latest
    if: github.repository_owner == 'furnyr'
    defaults:
      run:
        working-directory: "./website"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26

      - name: Install Dependencies
        run: pnpm install

      - name: Install Doxygen Dependencies
        run: pnpm install
        working-directory: "doxygen"
      
      - name: Install Doxygen
        run: |
          wget https://www.doxygen.nl/files/doxygen-1.12.0.linux.bin.tar.gz
          tar -xzf doxygen-1.12.0.linux.bin.tar.gz
          sudo cp doxygen-1.12.0/bin/doxygen /usr/local/bin/doxygen

      - name: Check Doxygen version
        run: doxygen -v

      - name: Generate Documentation
        run: doxygen Doxyfile
        working-directory: "doxygen"

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "website/dist"
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5